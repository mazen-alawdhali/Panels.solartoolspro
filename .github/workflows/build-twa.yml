name: Build Solar Panels Calculator (TWA)

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: 'رابط البداية والمسار (غيّر الرقم في النهاية مثل /?apk_ver=8)'
        required: true
        default: '/?apk_ver=8'
      version_code:
        description: 'رقم Version Code لمتجر Google Play (الحالي 7، القادم 8)'
        required: true
        default: '8'
      version_name:
        description: 'اسم الإصدار الظاهر للمستخدم (Version Name)'
        required: true
        default: '8.0'

jobs:
  build-twa:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Paths (No Interactive Prompts)
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing.keystore

      - name: Generate TWA Project & Build Signed AAB + APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.mazen.Solar.Panel.Calc",
            "host": "panels.solartoolspro.com",
            "name": "حاسبة الألواح الشمسية",
            "launcherName": "حاسبة الألواح",
            "display": "standalone",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "navigationColorDark": "#0f172a",
            "navigationDividerColor": "#0f172a",
            "navigationDividerColorDark": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "${{ github.event.inputs.start_url }}",
            "iconUrl": "https://panels.solartoolspro.com/web-app-manifest-512x512.png",
            "maskableIconUrl": "https://panels.solartoolspro.com/web-app-manifest-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./signing.keystore",
              "alias": "${{ secrets.KEY_ALIAS }}"
            },
            "appVersionName": "${{ github.event.inputs.version_name }}",
            "appVersionCode": ${{ github.event.inputs.version_code }},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://panels.solartoolspro.com/site.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://panels.solartoolspro.com/",
            "minSdkVersion": 24,
            "orientation": "portrait"
          }
          EOF

          bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade && sed -i 's/versionName .*/versionName "${{ github.event.inputs.version_name }}"/g' app/build.gradle
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/signing.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename Output Files
        run: |
          mv app/build/outputs/bundle/release/app-release.aab "com.mazen.Solar.Panel.Calc-v${{ github.event.inputs.version_code }}.aab"
          mv app/build/outputs/apk/release/app-release.apk "حاسبة-الألواح-الشمسية-v${{ github.event.inputs.version_code }}.apk"

      - name: Upload Signed AAB & APK
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Panels-Calculator-Package-v${{ github.event.inputs.version_code }}
          path: |
            ./*.aab
            ./*.apk
