name: Build Solar Panels Calculator (TWA)

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: 'رابط البداية والمسار (غيّر الرقم في النهاية مثل /?apk_ver=8)'
        required: true
        default: '/?apk_ver=8'
      version_code:
        description: 'رقم Version Code لمتجر Google Play (الحالي 7، القادم 8)'
        required: true
        default: '8'
      version_name:
        description: 'اسم الإصدار الظاهر للمستخدم (Version Name)'
        required: true
        default: '1.0.8'

jobs:
  build-twa:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing.keystore

      - name: Generate TWA Manifest & Build Project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.mazen.Solar.Panel.Calc",
            "host": "panels.solartoolspro.com",
            "name": "حاسبة الألواح الشمسية",
            "launcherName": "حاسبة الألواح",
            "display": "standalone",
            "themeColor": "#010306",
            "navigationColor": "#010306",
            "navigationColorDark": "#010306",
            "navigationDividerColor": "#010306",
            "navigationDividerColorDark": "#010306",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "${{ github.event.inputs.start_url }}",
            "iconUrl": "https://panels.solartoolspro.com/web-app-manifest-512x512.png",
            "maskableIconUrl": "https://panels.solartoolspro.com/web-app-manifest-512x512.png",
            "monochromeIconUrl": "https://panels.solartoolspro.com/web-app-manifest-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./signing.keystore",
              "alias": "${{ secrets.KEY_ALIAS }}"
            },
            "appVersionName": "${{ github.event.inputs.version_name }}",
            "appVersionCode": ${{ github.event.inputs.version_code }},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://panels.solartoolspro.com/site.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://panels.solartoolspro.com/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          EOF

          yes | bubblewrap update --manifest=twa-manifest.json
          printf "%s\n%s\n" "$BUBBLEWRAP_KEYSTORE_PASSWORD" "$BUBBLEWRAP_KEY_PASSWORD" | bubblewrap build --skipPwaValidation

      - name: Rename Output Files
        run: |
          mv app-release-bundle.aab "com.mazen.Solar.Panel.Calc-v${{ github.event.inputs.version_code }}.aab"
          mv app-release-signed.apk "حاسبة-الألواح-الشمسية-v${{ github.event.inputs.version_code }}.apk"

      - name: Upload Signed AAB & APK
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Panels-Package-v${{ github.event.inputs.version_code }}
          path: |
            ./*.aab
            ./*.apk
